# Supabase local development configuration for KINDLY.
# `supabase start` brings up Postgres, Auth, Realtime, Storage and Studio.
project_id = "kindly"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
# The `kindly` schema is deliberately NOT exposed: helper predicates and
# security-definer internals must not be callable from a browser.
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:4173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
# Sessions expire after 30 days of inactivity; caregivers stay signed in on a
# family device without the app ever storing credentials itself.
[auth.sessions]
timebox = "720h"
inactivity_timeout = "336h"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 20
token_refresh = 150
verify = 20

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
